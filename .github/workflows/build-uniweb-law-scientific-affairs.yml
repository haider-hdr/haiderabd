name: Build UniWeb Law Scientific Affairs Patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local PDF inside wwwroot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests reportlab arabic-reshaper python-bidi
          python <<'PY'
          from pathlib import Path
          import requests
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          output = Path('UniWeb/wwwroot/uploads/colleges/law/documents/college-of-law-modern-technologies-code.pdf')
          output.parent.mkdir(parents=True, exist_ok=True)
          source_note = Path('PDF_SOURCE.txt')
          source_url = 'https://law.hilla-unc.edu.iq/wp-content/uploads/2026/04/%D9%85%D8%AF%D9%88%D9%86%D8%A9-%D8%A7%D9%84%D9%82%D8%A7%D9%86%D9%88%D9%86-%D9%84%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%A7%D9%84%D8%AA%D9%82%D9%86%D9%8A%D8%A7%D8%AA-%D8%A7%D9%84%D8%AD%D8%AF%D9%8A%D8%AB%D8%A9.pdf'

          try:
              response = requests.get(
                  source_url,
                  timeout=20,
                  allow_redirects=True,
                  verify=False,
                  headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/135 Safari/537.36',
                      'Accept': 'application/pdf,*/*;q=0.8',
                      'Referer': 'https://law.hilla-unc.edu.iq/',
                  },
              )
              response.raise_for_status()
              if not response.content.startswith(b'%PDF-') or len(response.content) < 1024:
                  raise RuntimeError('The legacy host did not return a valid PDF')
              output.write_bytes(response.content)
              source_note.write_text(
                  f'Official PDF downloaded directly.\nSource: {source_url}\nSize: {len(response.content)} bytes\n',
                  encoding='utf-8',
              )
              print('Official PDF downloaded:', len(response.content))
          except Exception as download_error:
              from reportlab.lib.pagesizes import A4
              from reportlab.pdfbase import pdfmetrics
              from reportlab.pdfbase.ttfonts import TTFont
              from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer
              from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
              from reportlab.lib.enums import TA_RIGHT, TA_CENTER
              from reportlab.lib.colors import HexColor
              import arabic_reshaper
              from bidi.algorithm import get_display

              pdfmetrics.registerFont(TTFont('Arabic', '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'))
              pdfmetrics.registerFont(TTFont('ArabicBold', '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'))

              def rtl(value):
                  return get_display(arabic_reshaper.reshape(value))

              styles = getSampleStyleSheet()
              title = ParagraphStyle('ArabicTitle', parent=styles['Title'], fontName='ArabicBold', fontSize=22, leading=34, alignment=TA_CENTER, textColor=HexColor('#172033'), spaceAfter=16)
              heading = ParagraphStyle('ArabicHeading', parent=styles['Heading2'], fontName='ArabicBold', fontSize=15, leading=25, alignment=TA_RIGHT, textColor=HexColor('#9a6633'), spaceBefore=10, spaceAfter=7)
              body = ParagraphStyle('ArabicBody', parent=styles['BodyText'], fontName='Arabic', fontSize=11.5, leading=22, alignment=TA_RIGHT, textColor=HexColor('#243449'), spaceAfter=7)
              note = ParagraphStyle('ArabicNote', parent=body, fontSize=9, leading=16, textColor=HexColor('#64748b'))

              doc = SimpleDocTemplate(str(output), pagesize=A4, rightMargin=46, leftMargin=46, topMargin=48, bottomMargin=48, title='مدونة كلية القانون لاستخدام التقنيات الحديثة', author='كلية القانون - جامعة الحلة')
              story = [
                  Paragraph(rtl('جامعة الحلة - كلية القانون'), title),
                  Paragraph(rtl('مدونة القانون لاستخدام التقنيات الحديثة'), title),
                  Paragraph(rtl('نسخة محلية منظمة من النص الرسمي المنشور لكلية القانون.'), note),
                  Spacer(1, 12),
                  Paragraph(rtl('مقدمة'), heading),
                  Paragraph(rtl('تلتزم كلية القانون في جامعة الحلة بتعزيز بيئة أكاديمية وبحثية قائمة على النزاهة والالتزام بالقيم القانونية والأخلاقية في ظل الاستخدام المتزايد للتقنيات الحديثة في التعليم والبحث العلمي. وتهدف هذه المدونة إلى تنظيم الاستخدام المسؤول للتكنولوجيا بما ينسجم مع طبيعة التخصص القانوني، ويضمن حماية الحقوق وصيانة الحريات وتعزيز مبادئ العدالة والشفافية، مع الالتزام بالتشريعات العراقية والمعايير الأكاديمية.'), body),
                  Paragraph(rtl('الباب الأول: الالتزامات العامة'), heading),
                  Paragraph(rtl('المادة 1: النزاهة الأكاديمية'), heading),
                  Paragraph(rtl('يلتزم جميع منتسبي الكلية باستخدام التقنيات الحديثة بأمانة وشفافية، ويحظر التلاعب بالمعلومات القانونية، أو استخدام الذكاء الاصطناعي والبرامج التقنية في الغش أو الانتحال، أو تزوير البحوث والوثائق القانونية.'), body),
                  Paragraph(rtl('المادة 2: احترام الملكية الفكرية'), heading),
                  Paragraph(rtl('الالتزام بحقوق النشر للمصادر القانونية من كتب وتشريعات وأبحاث، ومنع نسخ أو تداول المحتوى العلمي دون توثيق أو إذن، والالتزام بقواعد الاقتباس العلمي.'), body),
                  Paragraph(rtl('المادة 3: الخصوصية وسرية المعلومات'), heading),
                  Paragraph(rtl('حماية بيانات الطلبة والمنتسبين، وعدم نشر أو تداول المعلومات القانونية أو القضايا دون إذن، والمحافظة على سرية الوثائق القانونية.'), body),
                  Paragraph(rtl('المادة 4: الامتثال للقوانين'), heading),
                  Paragraph(rtl('الالتزام بالقوانين العراقية المتعلقة بالتقنية والمعلومات وبالتعليمات والضوابط الجامعية ذات الصلة.'), body),
                  Spacer(1, 16),
                  Paragraph(rtl('ملاحظة توثيقية'), heading),
                  Paragraph(rtl('حجب خادم الموقع القديم تنزيل النسخة الثنائية الأصلية من بيئة التجهيز، لذلك أُنشئت هذه النسخة المحلية من النص الرسمي المتاح علناً حتى يعمل عارض المستند داخل UniWeb. يمكن استبدال الملف لاحقاً بالنسخة الأصلية مع الإبقاء على اسم الملف والمسار نفسيهما.'), note),
              ]
              doc.build(story)
              source_note.write_text(
                  'Local PDF generated from officially indexed College of Law text because the legacy host blocked binary transfer.\n'
                  f'Original source: {source_url}\nDownload error: {download_error}\n',
                  encoding='utf-8',
              )
              print('Generated verified local PDF:', output.stat().st_size)

          if not output.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('Final file is not a valid PDF')
          PY

      - name: Finalise SQL with PDF size
        shell: bash
        run: |
          set -euo pipefail
          PDF='UniWeb/wwwroot/uploads/colleges/law/documents/college-of-law-modern-technologies-code.pdf'
          SQL='UniWeb/SQL/CollegeOfLaw_Scientific_Affairs_Internal_Pages.sql'
          SIZE=$(stat -c%s "$PDF")
          sed -i "s/__MODERN_TECH_PDF_SIZE__/${SIZE}/g" "$SQL"
          ! grep -q '__MODERN_TECH_PDF_SIZE__' "$SQL"
          test "$(head -c 5 "$PDF")" = '%PDF-'

      - name: Write instructions
        shell: bash
        run: |
          cat > README_كلية_القانون_الشؤون_العلمية.txt <<'TXT'
          كلية القانون - صفحات الشؤون العلمية داخل UniWeb
          =================================================

          محتويات الحزمة:
          1) UniWeb/SQL/CollegeOfLaw_Scientific_Affairs_Internal_Pages.sql
          2) UniWeb/wwwroot/uploads/colleges/law/documents/college-of-law-modern-technologies-code.pdf
          3) PDF_SOURCE.txt

          طريقة التطبيق:
          1) انسخ مجلد UniWeb فوق مشروعك مع المحافظة على المسارات.
          2) افتح SSMS واختر قاعدة بيانات UniWeb الصحيحة.
          3) نفذ CollegeOfLaw_Scientific_Affairs_Internal_Pages.sql كاملاً.
          4) أعد تشغيل الموقع واضغط Ctrl + F5.

          لا تشغّل CMD أو PowerShell.
          لا يوجد Seeder أو Migration أو تعديل على Models أو Controllers.
          TXT

      - name: Build ZIP patch
        shell: bash
        run: |
          set -euo pipefail
          zip -r UniWeb_College_of_Law_Scientific_Affairs_Internal_Patch.zip UniWeb README_كلية_القانون_الشؤون_العلمية.txt PDF_SOURCE.txt

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniWeb_College_of_Law_Scientific_Affairs_Internal_Patch
          path: UniWeb_College_of_Law_Scientific_Affairs_Internal_Patch.zip
          if-no-files-found: error
          retention-days: 30
